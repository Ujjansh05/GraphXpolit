name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            binary: target/release/graphxploit.exe
          - os: ubuntu-latest
            target: linux-x86_64
            binary: target/release/graphxploit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $version."
          }
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test every feature
        run: cargo test --all-features --locked
      - name: Build locked lightweight binary
        run: cargo build --release --locked
      - name: Enforce size, package, and checksum
        shell: pwsh
        run: |
          $binary = '${{ matrix.binary }}'
          if ((Get-Item $binary).Length -gt 25MB) {
            throw "Release binary exceeds the 25 MiB budget."
          }
          $archive = 'graphxploit-${{ matrix.target }}.zip'
          Compress-Archive -LiteralPath $binary -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -NoNewline
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphxploit-${{ matrix.target }}
          path: |
            graphxploit-${{ matrix.target }}.zip
            graphxploit-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.sha256
