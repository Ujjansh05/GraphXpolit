name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.90.0'
      - run: cargo check --all-features --locked
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: [dependency-audit, msrv]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build ${{ matrix.target }} ${{ matrix.edition }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            edition: lite
            feature_args: ""
            binary: target/release/graphxploit.exe
            shim: gx.cmd
            archive: graphxploit-windows-x86_64.zip
            budget_mb: 25
          - os: windows-latest
            target: windows-x86_64
            edition: ai
            feature_args: "--features ai"
            binary: target/release/graphxploit.exe
            shim: gx.cmd
            archive: graphxploit-windows-x86_64-ai.zip
            budget_mb: 35
          - os: ubuntu-latest
            target: linux-x86_64
            edition: lite
            feature_args: ""
            binary: target/release/graphxploit
            shim: gx
            archive: graphxploit-linux-x86_64.zip
            budget_mb: 25
          - os: ubuntu-latest
            target: linux-x86_64
            edition: ai
            feature_args: "--features ai"
            binary: target/release/graphxploit
            shim: gx
            archive: graphxploit-linux-x86_64-ai.zip
            budget_mb: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Tag version $tagVersion does not match Cargo.toml version $version."
          }
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test Lite edition
        run: cargo test --locked
      - name: Test AI edition
        run: cargo test --all-features --locked
      - name: Build locked ${{ matrix.edition }} binary
        shell: pwsh
        run: cargo build --release --locked ${{ matrix.feature_args }}
      - name: Smoke-test packaged edition
        shell: pwsh
        run: ./scripts/smoke.ps1 -Binary '${{ matrix.binary }}'
      - name: Test secret-check script on hidden files
        shell: pwsh
        run: ./scripts/test-check-secrets.ps1
      - name: Check supported credential patterns
        shell: pwsh
        run: ./scripts/check-secrets.ps1
      - name: Enforce size, package, and checksum
        shell: pwsh
        run: |
          $binary = '${{ matrix.binary }}'
          $budget = [int]'${{ matrix.budget_mb }}' * 1MB
          if ((Get-Item $binary).Length -gt $budget) {
            throw "Release binary exceeds the ${{ matrix.budget_mb }} MiB budget."
          }
          $archive = '${{ matrix.archive }}'
          Compress-Archive -LiteralPath @($binary, '${{ matrix.shim }}') -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -NoNewline
      - name: Generate SBOM
        shell: pwsh
        run: |
          if ('${{ matrix.edition }}' -eq 'ai') {
            ./scripts/sbom.ps1 -OutputFile '${{ matrix.archive }}.cdx.json' -Ai
          } else {
            ./scripts/sbom.ps1 -OutputFile '${{ matrix.archive }}.cdx.json'
          }
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphxploit-${{ matrix.target }}-${{ matrix.edition }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.archive }}.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.sha256
            release/*.cdx.json
