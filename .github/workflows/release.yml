name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            binary: target/release/graphxploit.exe
          - os: ubuntu-latest
            target: linux-x86_64
            binary: target/release/graphxploit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build default lightweight binary
        run: cargo build --release
      - name: Package binary
        shell: pwsh
        run: Compress-Archive -LiteralPath '${{ matrix.binary }}' -DestinationPath 'graphxploit-${{ matrix.target }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: graphxploit-${{ matrix.target }}
          path: graphxploit-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
